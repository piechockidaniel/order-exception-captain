[project]
name = "order-exception-captain"
version = "0.1.0"
description = "ResolveDesk — a deterministic, approval-gated Strands workflow for ecommerce delivery exceptions."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "ResolveDesk contributors" }]
dependencies = [
    "botocore[crt]>=1.43,<2",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "strands-agents[openai]>=1.0,<2",
    "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
order-exception-captain = "order_exception_captain.app:main"
order-exception-captain-api = "order_exception_captain.api:main"
order-exception-captain-live = "order_exception_captain.live_demo:main"
order-exception-captain-scan = "order_exception_captain.scheduled_scan:main"
order-exception-captain-scan-woocommerce = "order_exception_captain.woocommerce_scan:main"
order-exception-captain-backup = "order_exception_captain.backup:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/order_exception_captain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
